name: Add 3D Models

on:
  repository_dispatch:
    types: [add_models]

jobs:
  add-models:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download release assets
        run: |
          mkdir -p models
          gh release download v1.0.0 -R ${{ github.repository }} -D models --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit and push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add models/
          git commit -m "Add 3D model GLB files [skip ci]" || echo "No changes"
          git push