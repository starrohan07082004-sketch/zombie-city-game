name: Add 3D Models and Update Index

on:
  repository_dispatch:
    types: [add_models]

jobs:
  add-models:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all release assets
        run: |
          mkdir -p models
          gh release download v1.0.0 -R ${{ github.repository }} -D . --clobber --pattern '*.glb'
          gh release download v1.0.0 -R ${{ github.repository }} -D . --clobber --pattern 'index_v20.html'
          mv -f index_v20.html index.html
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Move models to models directory
        run: |
          for f in character.glb ak-47.glb ak103.glb city.glb character_new.glb zombie.glb character_boy.glb character_tactical.glb; do
            if [ -f "$f" ]; then
              mv "$f" "models/$f"
            fi
          done
      - name: Commit and push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git commit -m "v20: fixed character scale + zombie + camera [skip ci]" || echo "No changes"
          git push