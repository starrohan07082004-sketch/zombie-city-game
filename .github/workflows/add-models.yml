name: Add 3D Models and Update Index

on:
  repository_dispatch:
    types: [add_models]

jobs:
  add-models:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all release assets
        run: |
          mkdir -p models
          gh release download v1.0.0 -R ${{ github.repository }} -D . --clobber --pattern '*.glb'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Move models to models directory
        run: |
          for f in character.glb ak-47.glb ak103.glb city.glb; do
            if [ -f "$f" ]; then
              mv "$f" "models/$f"
            fi
          done
      - name: Fix loading screen CSS bug
        run: |
          sed -i 's/#screen-loading{background:radial-gradient(circle at 50% 40%,#1a0f0f 0%,#050202 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1000}/#screen-loading{background:radial-gradient(circle at 50% 40%,#1a0f0f 0%,#050202 100%)}#screen-loading.active{display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1000}/g' index.html
      - name: Commit and push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git commit -m "Fix loading screen CSS bug + update models [skip ci]" || echo "No changes"
          git push